<html lang="es">
<head>

<title>Formularios · Culligan Biofy</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--surface-2:#fafbfd;--surface-3:#eef0f5;--line:#e6e8ef;--line-2:#d2d6e0;
  --ink:#1b1d23;--ink-2:#4d525e;--ink-3:#8a90a0;
  --brand:#2968fe;--brand-soft:#e9effe;--brand-ink:#1a4fd6;
  --good:#1d8a4a;--good-soft:#e5f5eb;--warn:#a86300;--warn-soft:#fff3df;--bad:#cc3333;--bad-soft:#fdeceb;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 8px 26px rgba(20,30,60,.06);--r:20px;--ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1015;--surface:#171a21;--surface-2:#1b1f27;--surface-3:#232833;--line:#2a2f3a;--line-2:#3a404d;
  --ink:#f1f3f7;--ink-2:#c3c8d2;--ink-3:#8c93a1;--brand:#4b82ff;--brand-soft:#1a2747;--brand-ink:#9dbbff;
  --good:#4cc47f;--good-soft:#15301f;--warn:#f0b056;--warn-soft:#3a2a12;--bad:#ff7b7b;--bad-soft:#3a1a1a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);color-scheme:dark}
  .logo{filter:brightness(0) invert(1)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.hidden{display:none!important}.muted{color:var(--ink-3)}
.wrap{max-width:860px;margin:0 auto;padding:22px 18px 80px}
.wrap.wide{max-width:1200px}
/* cabecera */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 18px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;cursor:pointer}
.logo{height:46px;display:block}
.pill{display:inline-flex;align-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:99px;padding:7px 16px;font-size:14.5px;white-space:nowrap}
.who{font-size:12.5px;color:var(--ink-3);text-align:right;line-height:1.3}.who b{display:block;color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .12s}
.btn:hover{background:var(--surface-3)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(41,104,254,.28)}.btn.primary:hover{background:var(--brand-ink)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent}.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px;width:100%}
.btn.danger{color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
/* candado */
#lock{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1000px 500px at 50% -10%,color-mix(in srgb,var(--brand) 14%,var(--bg)) 0%,var(--bg) 60%)}
.lock-card{width:min(400px,100%);text-align:center;padding:34px 28px 28px}
.lock-card .lb{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}.lock-card .logo{height:72px}
.lock-card h2{font-size:21px}.lock-card p{color:var(--ink-3);margin:6px 0 18px;font-size:14px}
.field{width:100%;border:1.5px solid var(--line-2);border-radius:13px;padding:13px 14px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s;font-size:16px}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2);margin:12px 0}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
/* portada */
.hero{padding:6px 2px 18px}.hero h1{font-size:28px}.hero p{color:var(--ink-3);margin:6px 0 0}
.flist{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.fcard{cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease);position:relative;overflow:hidden}
.fcard:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(20,30,60,.12)}
.fcard::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:var(--brand-soft)}
.fcard .ic{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-bottom:14px;position:relative;z-index:1}
.fcard h3{font-size:17px;position:relative;z-index:1}.fcard p{color:var(--ink-2);font-size:13.5px;margin:6px 0 12px;position:relative;z-index:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);position:relative;z-index:1}.meta span{background:var(--surface-3);border-radius:99px;padding:2px 10px}
.admin-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0 14px}.admin-bar h2{font-size:19px;margin-right:auto}
/* formulario */
.prog{position:sticky;top:64px;z-index:15;background:var(--bg);padding:10px 0 8px}
.prog .bar{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#5a8bff);border-radius:6px;transition:width .5s var(--ease)}
.prog .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:5px}
.fhead h1{font-size:25px}.fhead p{color:var(--ink-2);margin:8px 0 0;white-space:pre-line}.fhead .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:4px}
.sec{margin-top:18px}.sec>h2{font-size:17px;margin-bottom:4px}.sec>.sd{color:var(--ink-3);font-size:13.5px;margin:0 0 4px}
.q{padding:18px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.q .qt{font-weight:600;font-size:15.5px}.q .qt .req{color:var(--bad);margin-left:3px}
.q .qh{color:var(--ink-3);font-size:13px;margin-top:2px}
.q .qb{margin-top:10px}
.q.bad .qt{color:var(--bad)}.q.bad .field,.q.bad .opts .op,.q.bad .sig{border-color:var(--bad)}
.q .qerr{color:var(--bad);font-size:12.5px;margin-top:6px;display:none}.q.bad .qerr{display:block}
textarea.field{min-height:96px;resize:vertical}
.opts{display:grid;gap:8px}
.op{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line-2);border-radius:13px;padding:12px 14px;cursor:pointer;transition:all .15s;background:var(--surface)}
.op:hover{border-color:var(--brand)}.op input{position:absolute;opacity:0;pointer-events:none}
.op .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;transition:all .15s}
.op.multi .mk{border-radius:6px}
.op.on{border-color:var(--brand);background:var(--brand-soft)}.op.on .mk{border-color:var(--brand);background:var(--brand)}
.op.on .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}.op.multi.on .mk::after{width:10px;height:6px;border-radius:0;background:none;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale button{flex:1 1 40px;min-width:40px;height:48px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;font-size:16px;transition:all .15s}
.scale button.on{background:var(--brand);border-color:var(--brand);color:#fff;transform:translateY(-2px)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}
.sig{position:relative;border:1.5px dashed var(--line-2);border-radius:14px;background:var(--surface-2);touch-action:none;overflow:hidden}
.sig canvas{display:block;width:100%;height:190px;cursor:crosshair;touch-action:none}
.sig .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);pointer-events:none;font-size:14px}
.sig .line{position:absolute;left:24px;right:24px;bottom:42px;border-bottom:1px solid var(--line-2);pointer-events:none}
.sig-act{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.info{background:var(--brand-soft);color:var(--brand-ink);border-radius:14px;padding:14px 16px;font-size:14px}
/* una pregunta por pantalla */
.step{padding-top:8px}
.stepc{min-height:min(52vh,440px);padding:26px 24px}
.stepc .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.stepc .sd{color:var(--ink-3);font-size:13.5px;margin:0 0 4px}
.stepc .q{border:0;padding:8px 0 0}
.stepc .qt{font-size:20px;line-height:1.38;font-weight:700}
.stepc .qb{margin-top:18px}
.stepc textarea.field{min-height:170px}
.stepc.fwd{animation:inR .38s var(--ease) both}.stepc.back{animation:inL .38s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.stepnav{display:flex;gap:10px;margin-top:14px}.stepnav .btn{padding:14px 18px;font-size:16px;border-radius:14px}.stepnav .primary{flex:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.welcome .wm{margin:18px 0 20px}.welcome .note{font-size:12.5px;text-align:center;margin-top:14px;color:var(--ink-3)}
@media (max-width:600px){.stepc{padding:22px 18px}.stepc .qt{font-size:18px}}
.done{text-align:center;padding:40px 24px}.done .ok{width:76px;height:76px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s var(--ease)}
.done h2{font-size:24px}.done p{color:var(--ink-2)}
/* panel de respuestas */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px}
.kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:500}.kpi .v{font-size:30px;font-weight:700;margin-top:4px}
.sum{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));margin-bottom:14px}
.sum h3{font-size:14.5px;margin-bottom:12px}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hb .n{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .tr{height:12px;border-radius:6px;background:var(--surface-3);overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .8s var(--ease)}.hb .v{text-align:right;font-weight:600}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover{background:var(--surface-2)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .3s var(--ease)}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.modal .mh h3{margin-right:auto}
.ans{padding:12px 0;border-top:1px solid var(--line)}.ans .k{font-size:12.5px;color:var(--ink-3);font-weight:600}.ans .a{margin-top:3px;white-space:pre-wrap}
.ans img{max-width:100%;background:#fff;border-radius:10px;border:1px solid var(--line)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:13.5px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}.toast.on{opacity:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--brand-soft);border-top-color:var(--brand);animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.enter{animation:up .45s var(--ease) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){.logo{height:38px}.pill{padding:5px 12px;font-size:13px}.who{display:none}.hero h1{font-size:23px}.fhead h1{font-size:21px}.card{padding:18px}}
</style>
</head>

// Contraseña -> secreto (mismo formato que el Dashboard y la Pizarra: PBKDF2 600.000 + AES-GCM)
async function openBlob(blob,pw){
  try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(blob.s),iterations:blob.n||600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(blob.i)},key,b64d(blob.c)));}catch(e){return null;}
}
// Cada respuesta: clave efímera ECDH P-256 + clave pública del panel -> AES-GCM
async function sealAnswer(obj){
  const pub=await crypto.subtle.importKey('jwk',CLOUD.pub,{name:'ECDH',namedCurve:'P-256'},false,[]);
  const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'ECDH',public:pub},eph.privateKey,{name:'AES-GCM',length:256},false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1,epk:await crypto.subtle.exportKey('jwk',eph.publicKey),iv:b64e(iv),c:b64e(c)};
}
async function openAnswer(env,privJwk){
  const priv=await crypto.subtle.importKey('jwk',privJwk,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
  const epk=await crypto.subtle.importKey('jwk',env.epk,{name:'ECDH',namedCurve:'P-256'},false,[]);
  const key=await crypto.subtle.deriveKey({name:'ECDH',public:epk},priv,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},key,b64d(env.c))));
}

/* ---------------- Almacén de respuestas ----------------
   GitHub (repositorio privado) o, en pruebas, este navegador. Cada respuesta es un archivo
   respuestas/<formulario>/<fecha>-<azar>.json con la respuesta cifrada. */
const sess={role:null,user:null,token:null,priv:null};
const GH='https://api.github.com';
const ghH=()=>({Authorization:'Bearer '+sess.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const dirOf=formId=>`${CLOUD.dir||'respuestas'}/${formId}`;
const store=CLOUD&&CLOUD.local?{
  async put(path,obj){const m=JSON.parse(S.get('fm_local')||'{}');m[path]=obj;S.set('fm_local',JSON.stringify(m));},
  async list(dir){const m=JSON.parse(S.get('fm_local')||'{}');return Object.keys(m).filter(k=>k.startsWith(dir+'/')).map(p=>({path:p,name:p.split('/').pop(),sha:'local'}));},
  async get(path){return JSON.parse(S.get('fm_local')||'{}')[path];},
  async del(path){const m=JSON.parse(S.get('fm_local')||'{}');delete m[path];S.set('fm_local',JSON.stringify(m));},
}:{
  async put(path,obj){const r=await fetch(`${GH}/repos/${CLOUD.owner}/${CLOUD.repo}/contents/${encodeURI(path)}`,{method:'PUT',headers:ghH(),body:JSON.stringify({message:'Nueva respuesta',content:utf8b64(JSON.stringify(obj)),branch:CLOUD.branch||'main'})});if(!r.ok)throw new Error('GitHub '+r.status);},
  async list(dir){const r=await fetch(`${GH}/repos/${CLOUD.owner}/${CLOUD.repo}/contents/${encodeURI(dir)}?ref=${CLOUD.branch||'main'}&t=${Date.now()}`,{headers:ghH(),cache:'no-store'});if(r.status===404)return[];if(!r.ok)throw new Error('GitHub '+r.status);return (await r.json()).filter(x=>x.type==='file'&&x.name.endsWith('.json'));},
  async get(path){const r=await fetch(`${GH}/repos/${CLOUD.owner}/${CLOUD.repo}/contents/${encodeURI(path)}?ref=${CLOUD.branch||'main'}`,{headers:{...ghH(),Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(!r.ok)throw new Error('GitHub '+r.status);return r.json();},
  async del(path,sha){const r=await fetch(`${GH}/repos/${CLOUD.owner}/${CLOUD.repo}/contents/${encodeURI(path)}`,{method:'DELETE',headers:ghH(),body:JSON.stringify({message:'Respuesta borrada',sha,branch:CLOUD.branch||'main'})});if(!r.ok)throw new Error('GitHub '+r.status);},
};

}

/* ---------------- Formulario ----------------
   Tipos de pregunta: texto · parrafo · numero · email · telefono · fecha · opcion (una) · varias · escala · firma · info
   (preparado para añadir «archivo» cuando haga falta subir documentos) */
let F=null,ANS={};
/* Modo «una pregunta por pantalla» (el normal). Un formulario con "modo":"lista" sale todo seguido.
   Cada pantalla tiene su dirección (#/f/<id>/<n>), así el botón «atrás» del móvil también funciona. */
let FILL=null,STEPS=[],STEP=-1;
const cleanNum=t=>String(t).replace(/^\d+\.\s+/,'');
function viewForm(f,arg){
  if(f.modo==='lista')return viewFormList(f);
  if(FILL!==f.id){F=f;FILL=f.id;ANS={};const d=S.get('fm_draft_'+f.id);if(d)try{ANS=JSON.parse(d);}catch(e){}
    STEPS=f.secciones.flatMap(s=>s.preguntas.map(q=>({q,s})));STEP=-1;}
  F=f;
  let n=arg==null||arg===''?-1:parseInt(arg,10)-1;if(isNaN(n))n=-1;n=Math.min(Math.max(n,-1),STEPS.length-1);
  // No se puede saltar por delante de una obligatoria sin responder
  const fm=STEPS.findIndex(x=>x.q.obligatoria&&x.q.tipo!=='info'&&!isAnswered(x.q));
  if(fm>=0&&n>fm){n=fm;history.replaceState(null,'',`#/f/${f.id}/${n+1}`);}
  const dir=n>=STEP?'fwd':'back';STEP=n;
  if(n<0)return stepWelcome(f);
  stepShow(n,dir);
}
const goStep=i=>{location.hash=i<0?`#/f/${F.id}`:`#/f/${F.id}/${i+1}`;};
function stepWelcome(f){
  const qs=allQ(),done=qs.filter(isAnswered).length;
  $('#main').innerHTML=`<div class="wrap"><div class="card fhead welcome enter">${f.descripcion?`<div class="eyebrow">${esc(f.descripcion)}</div>`:''}<h1>${esc(f.titulo)}</h1>${f.intro?`<p>${esc(f.intro)}</p>`:''}
    <div class="meta wm">${f.duracion?`<span>⏱ ${esc(f.duracion)}</span>`:''}<span>${qs.length} preguntas</span><span>Una por pantalla</span></div>
    <button class="btn primary big" id="bGo">${done?`Continuar · llevas ${done} de ${qs.length}`:'Empezar'}</button>
    ${done?'<button class="btn ghost sm" id="bReset" style="margin-top:10px;width:100%">Empezar de cero</button>':''}
    <div class="note">Si sales a medias, tus respuestas se quedan guardadas en este dispositivo. Al enviarlas van cifradas: solo las ven las personas autorizadas.</div></div></div>`;
  $('#bGo').onclick=()=>{let i=done?STEPS.findIndex(x=>x.q.tipo!=='info'&&!isAnswered(x.q)):0;if(i<0)i=STEPS.length-1;goStep(i);};
  const r=$('#bReset');if(r)r.onclick=()=>{if(!r.dataset.armed){r.dataset.armed=1;r.textContent='¿Seguro? Se borra lo que llevas. Pulsa otra vez';return;}ANS={};S.del('fm_draft_'+f.id);stepWelcome(f);};
}
function stepShow(n,dir){
  const {q,s}=STEPS[n],last=n===STEPS.length-1,L=STEPS.length;
  const newSec=!STEPS[n-1]||STEPS[n-1].s!==s;
  $('#main').innerHTML=`<div class="prog"><div class="wrap" style="padding:0 18px"><div class="bar"><i id="pBar" style="width:${(dir==='fwd'?n:n+2)/L*100}%"></i></div><div class="t"><span>Pregunta ${n+1} de ${L}</span><span id="pTxt"></span></div></div></div>
    <div class="wrap step"><div class="card stepc ${dir}">${s.titulo?`<div class="eyebrow">${esc(s.titulo)}</div>`:''}${s.descripcion&&newSec?`<p class="sd">${esc(s.descripcion)}</p>`:''}${qHTML({...q,texto:cleanNum(q.texto)})}</div>
    <div class="stepnav"><button class="btn" id="bBack">← ${n?'Atrás':'Inicio'}</button><button class="btn primary" id="bNext">${last?'Enviar respuestas':'Siguiente →'}</button></div>
    ${last?'<p class="muted" style="text-align:center;font-size:12.5px;margin-top:10px">Tus respuestas se guardan cifradas. Solo las ven las personas autorizadas.</p>':''}</div>`;
  bindForm();progress();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$('#pBar');if(b)b.style.width=(n+1)/L*100+'%';}));
  const next=()=>{
    if(q.obligatoria&&q.tipo!=='info'&&!isAnswered(q)){const w=document.getElementById('w_'+q.id);w.classList.remove('bad','shake');void w.offsetWidth;w.classList.add('bad','shake');return;}
    if(last)send();else goStep(n+1);
  };
  $('#bBack').onclick=()=>goStep(n-1);$('#bNext').onclick=next;
  // Al elegir una opción o un número, pasa sola a la siguiente
  const m=$('#main'),oc=m.onchange,ok=m.onclick;
  const auto=()=>{if(last)return;const my=n;setTimeout(()=>{if(STEP===my&&FILL===F.id&&isAnswered(q))goStep(my+1);},420);};
  if(q.tipo==='opcion')m.onchange=e=>{oc(e);auto();};
  if(q.tipo==='escala')m.onclick=e=>{ok(e);if(e.target.closest('.scale button'))auto();};
  const el=document.getElementById('q_'+q.id);
  if(el&&['texto','numero','email','telefono','fecha'].includes(q.tipo)){el.setAttribute('enterkeyhint','next');el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();next();}};}
  if(el&&matchMedia('(pointer:fine)').matches)setTimeout(()=>el.focus({preventScroll:true}),380);
}
function viewFormList(f){
  F=f;ANS={};
  const draft=S.get('fm_draft_'+f.id);if(draft)try{ANS=JSON.parse(draft);}catch(e){}
  let h=`<div class="prog"><div class="wrap" style="padding:0 18px"><div class="bar"><i id="pBar"></i></div><div class="t"><span id="pTxt"></span><span>${esc(f.duracion||'')}</span></div></div></div>
    <div class="wrap"><div class="card fhead enter">${f.intro&&f.descripcion?`<div class="eyebrow">${esc(f.descripcion)}</div>`:''}<h1>${esc(f.titulo)}</h1>${f.intro||f.descripcion?`<p>${esc(f.intro||f.descripcion)}</p>`:''}</div>`;
  f.secciones.forEach((s,si)=>{h+=`<div class="card sec enter" style="animation-delay:${si*50}ms">${s.titulo?`<h2>${esc(s.titulo)}</h2>`:''}${s.descripcion?`<p class="sd">${esc(s.descripcion)}</p>`:''}${s.preguntas.map(qHTML).join('')}</div>`;});
  h+=`<div style="margin-top:18px"><button class="btn primary big" id="btnSend">Enviar respuestas</button><p class="muted" style="text-align:center;font-size:12.5px;margin-top:10px">Tus respuestas se guardan cifradas. Solo las ven las personas autorizadas.</p></div></div>`;
  $('#main').innerHTML=h;
  bindForm();progress();
}
function qHTML(q){
  if(q.tipo==='info')return `<div class="q"><div class="info">${esc(q.texto)}</div></div>`;
  const v=ANS[q.id],id='q_'+q.id;let b='';
  const inp=(type,extra='')=>`<input class="field" id="${id}" data-q="${esc(q.id)}" type="${type}" value="${esc(v??'')}" ${extra}>`;
  switch(q.tipo){
    case 'texto':b=inp('text',`placeholder="${esc(q.placeholder||'Tu respuesta')}"`);break;
    case 'email':b=inp('email','inputmode="email" autocomplete="email"');break;
    case 'telefono':b=inp('tel','inputmode="tel"');break;
    case 'numero':b=inp('number',`inputmode="decimal" ${q.min!=null?`min="${q.min}"`:''} ${q.max!=null?`max="${q.max}"`:''}`);break;
    case 'fecha':b=inp('date');break;
    case 'parrafo':b=`<textarea class="field" id="${id}" data-q="${esc(q.id)}" placeholder="${esc(q.placeholder||'Tu respuesta')}">${esc(v??'')}</textarea>`;break;
    case 'opcion':case 'varias':{const multi=q.tipo==='varias',sel=multi?(v||[]):[v];
      b=`<div class="opts" data-q="${esc(q.id)}" data-multi="${multi?1:0}">${q.opciones.map(o=>`<label class="op ${multi?'multi':''} ${sel.includes(o)?'on':''}"><input type="${multi?'checkbox':'radio'}" name="${id}" value="${esc(o)}" ${sel.includes(o)?'checked':''}><span class="mk"></span><span>${esc(o)}</span></label>`).join('')}</div>`;break;}
    case 'escala':{const a=q.min??1,z=q.max??5;b=`<div class="scale" data-q="${esc(q.id)}">${Array.from({length:z-a+1},(_,i)=>a+i).map(n=>`<button type="button" data-v="${n}" class="${v===n?'on':''}">${n}</button>`).join('')}</div>${q.etiquetas?`<div class="scale-l"><span>${esc(q.etiquetas[0])}</span><span>${esc(q.etiquetas[1])}</span></div>`:''}`;break;}
    case 'firma':b=`<div class="sig" data-q="${esc(q.id)}"><canvas></canvas><div class="line"></div><div class="ph ${v?'hidden':''}">Firma aquí con el dedo</div></div><div class="sig-act"><span>${esc(q.ayuda_firma||'Usa el dedo o el ratón')}</span><button type="button" class="btn sm" data-clear="${esc(q.id)}">Borrar firma</button></div>`;break;
    default:b=`<p class="muted">Tipo de pregunta no disponible: ${esc(q.tipo)}</p>`;
  }
  return `<div class="q" id="w_${esc(q.id)}"><div class="qt">${esc(q.texto)}${q.obligatoria?'<span class="req">*</span>':''}</div>${q.ayuda?`<div class="qh">${esc(q.ayuda)}</div>`:''}<div class="qb">${b}</div><div class="qerr">${esc(q.error||'Esta pregunta es obligatoria')}</div></div>`;
}
const allQ=()=>F.secciones.flatMap(s=>s.preguntas).filter(q=>q.tipo!=='info');
const isAnswered=q=>{const v=ANS[q.id];return Array.isArray(v)?v.length>0:v!=null&&String(v).trim()!=='';};
function saveDraft(){const d={...ANS};for(const q of allQ())if(q.tipo==='firma')delete d[q.id];S.set('fm_draft_'+F.id,JSON.stringify(d));}
function progress(){const qs=allQ(),n=qs.filter(isAnswered).length;if(FILL&&STEP>=0){const t=$('#pTxt');if(t)t.textContent=`${n} respondidas`;return;}$('#pBar').style.width=(qs.length?n/qs.length*100:0)+'%';$('#pTxt').textContent=`${n} de ${qs.length} respondidas`;}
function changed(qid){const w=document.getElementById('w_'+qid);if(w)w.classList.remove('bad');saveDraft();progress();}
function bindForm(){
  const m=$('#main');
  m.oninput=e=>{const el=e.target.closest('[data-q]');if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){const q=allQ().find(x=>x.id===el.dataset.q);ANS[el.dataset.q]=q&&q.tipo==='numero'?(el.value===''?'':Number(el.value)):el.value;changed(el.dataset.q);}};
  m.onchange=e=>{const box=e.target.closest('.opts');if(!box)return;const qid=box.dataset.q;
    if(box.dataset.multi==='1')ANS[qid]=[...box.querySelectorAll('input:checked')].map(i=>i.value);else ANS[qid]=e.target.value;
    box.querySelectorAll('.op').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));changed(qid);};
  m.onclick=e=>{const sb=e.target.closest('.scale button');if(sb){const box=sb.parentElement;ANS[box.dataset.q]=Number(sb.dataset.v);box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sb));changed(box.dataset.q);return;}
    const cl=e.target.closest('[data-clear]');if(cl){const pad=PADS[cl.dataset.clear];if(pad)pad.clear();delete ANS[cl.dataset.clear];changed(cl.dataset.clear);return;}};
  PADS={};document.querySelectorAll('.sig').forEach(el=>{PADS[el.dataset.q]=sigPad(el);});
  const bs=$('#btnSend');if(bs)bs.onclick=send;
}
/* ---------- Firma con el dedo ---------- */
let PADS={};
function sigPad(box){
  const cv=box.querySelector('canvas'),ph=box.querySelector('.ph'),qid=box.dataset.q;let ctx,drawing=false,last=null,dirty=false;
  const fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14213d';ctx.lineWidth=2.4;};
  fit();
  // Si ya había firmado (volver atrás), se vuelve a pintar
  if(ANS[qid]){const img=new Image();img.onload=()=>{const r=cv.getBoundingClientRect();ctx.drawImage(img,0,0,r.width,r.height);ph.classList.add('hidden');dirty=true;};img.src=ANS[qid];}
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);ctx.beginPath();ctx.arc(last.x,last.y,1.1,0,Math.PI*2);ctx.fillStyle='#14213d';ctx.fill();ph.classList.add('hidden');dirty=true;});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  const end=()=>{if(!drawing)return;drawing=false;if(dirty){ANS[qid]=exportSig(cv);changed(qid);}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
  return{clear(){ctx.clearRect(0,0,cv.width,cv.height);ph.classList.remove('hidden');dirty=false;}};
}
// La firma se guarda como imagen PNG pequeña con fondo blanco (unos 10-30 KB)
function exportSig(cv){const w=600,h=Math.round(600*cv.height/cv.width),o=document.createElement('canvas');o.width=w;o.height=h;const c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(cv,0,0,w,h);return o.toDataURL('image/png');}

async function send(){
  const miss=allQ().filter(q=>q.obligatoria&&!isAnswered(q));
  document.querySelectorAll('.q.bad').forEach(x=>x.classList.remove('bad'));
  if(miss.length&&FILL){toast(miss.length===1?'Falta 1 pregunta obligatoria':`Faltan ${miss.length} preguntas obligatorias`);goStep(STEPS.findIndex(x=>x.q.id===miss[0].id));return;}
  if(miss.length){miss.forEach(q=>{const w=document.getElementById('w_'+q.id);if(w)w.classList.add('bad');});document.getElementById('w_'+miss[0].id).scrollIntoView({behavior:'smooth',block:'center'});toast(miss.length===1?'Falta 1 pregunta obligatoria':`Faltan ${miss.length} preguntas obligatorias`);return;}
  const b=$('#btnSend')||$('#bNext');b.disabled=true;b.innerHTML='<span class="spin"></span> Enviando…';
  try{
    const at=new Date().toISOString(),rid=at.replace(/[:.]/g,'-')+'-'+Math.random().toString(36).slice(2,8);
    const answer={form:F.id,version:F.version||1,at,answers:ANS,device:/Mobi|Android|iPhone/i.test(navigator.userAgent)?'móvil':'ordenador o tablet'};
    const env=await sealAnswer(answer);
    await store.put(`${dirOf(F.id)}/${rid}.json`,{form:F.id,at,...env});
    for(const d of DESTINOS)try{await d(F,answer);}catch(e){console.warn(e);}
    S.del('fm_draft_'+F.id);FILL=null;STEP=-1;
    $('#main').innerHTML=`<div class="wrap"><div class="card done"><div class="ok">${ICO.ok}</div><h2>¡Gracias!</h2><p>${esc(F.gracias||'Tus respuestas se han enviado correctamente.')}</p><button class="btn soft" onclick="location.hash=''">Volver al inicio</button></div></div>`;window.scrollTo(0,0);
  }catch(e){console.error(e);b.disabled=false;b.textContent='Enviar respuestas';toast('No se ha podido enviar. Revisa la conexión y vuelve a intentarlo: tus respuestas siguen aquí.');}
}

/* ---------------- Panel de respuestas (solo personas autorizadas) ---------------- */
let ROWS=[];
async function viewAnswers(f){
  F=f;$('#main').onclick=null;
  $('#main').innerHTML=`<div class="wrap wide"><div class="admin-bar"><h2>${esc(f.titulo)}</h2><button class="btn sm" id="bRef">Actualizar</button><button class="btn sm soft" id="bCsv">Descargar Excel (CSV)</button><button class="btn sm ghost" onclick="location.hash=''">← Inicio</button></div><div id="ansBody"><p class="muted"><span class="spin"></span> Cargando y descifrando respuestas…</p></div></div>`;
  $('#bRef').onclick=()=>viewAnswers(f);$('#bCsv').onclick=csv;
  try{
    const files=await store.list(dirOf(f.id));
    const out=[];let bad=0;const q=[...files];
    await Promise.all(Array.from({length:6},async()=>{while(q.length){const it=q.shift();try{const env=await store.get(it.path);const a=await openAnswer(env,sess.priv);out.push({...a,_path:it.path,_sha:it.sha});}catch(e){bad++;}}}));
    ROWS=out.sort((a,b)=>b.at.localeCompare(a.at));
    renderAnswers(bad);
  }catch(e){console.error(e);$('#ansBody').innerHTML=`<div class="notice">No se pudieron cargar las respuestas (${esc(e.message)}).</div>`;}
}
const fmtA=(q,v)=>v==null||v===''?'—':Array.isArray(v)?v.join(', '):q&&q.tipo==='firma'?'Firmado':String(v);
function renderAnswers(bad){
  const qs=allQ();const cols=(F.resumen||qs.filter(q=>q.tipo!=='firma').slice(0,3).map(q=>q.id)).map(id=>qs.find(q=>q.id===id)).filter(Boolean);
  let h=`<div class="kpis"><div class="card kpi"><div class="l">Respuestas</div><div class="v">${ROWS.length}</div></div><div class="card kpi"><div class="l">Última</div><div class="v" style="font-size:20px">${ROWS[0]?fmtD(ROWS[0].at):'—'}</div></div></div>`;
  if(bad)h+=`<div class="notice">${bad} respuesta(s) no se han podido leer.</div>`;
  const chart=qs.filter(q=>['opcion','varias','escala'].includes(q.tipo));
  if(ROWS.length&&chart.length)h+=`<div class="sum">${chart.map(q=>{const cnt=new Map();const keys=q.tipo==='escala'?Array.from({length:(q.max??5)-(q.min??1)+1},(_,i)=>(q.min??1)+i):q.opciones;keys.forEach(k=>cnt.set(k,0));
    for(const r of ROWS){const v=r.answers[q.id];for(const x of Array.isArray(v)?v:v==null?[]:[v])cnt.set(x,(cnt.get(x)||0)+1);}
    const mx=Math.max(1,...cnt.values());const avg=q.tipo==='escala'?(()=>{const vs=ROWS.map(r=>r.answers[q.id]).filter(v=>typeof v==='number');return vs.length?(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1).replace('.',','):null;})():null;
    return `<div class="card"><h3>${esc(q.texto)}${avg?` <span class="muted" style="font-weight:500">· media ${avg}</span>`:''}</h3>${[...cnt.entries()].map(([k,n])=>`<div class="hb"><div class="n" title="${esc(k)}">${esc(k)}</div><div class="tr"><i style="width:${n/mx*100}%"></i></div><div class="v">${n}</div></div>`).join('')}</div>`;}).join('')}</div>`;
  h+=`<div class="card"><h3 style="margin-bottom:10px">Todas las respuestas</h3>${ROWS.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th>${cols.map(q=>`<th>${esc(q.corto||q.texto)}</th>`).join('')}</tr></thead><tbody>${ROWS.map((r,i)=>`<tr data-i="${i}"><td>${fmtD(r.at)}</td>${cols.map(q=>`<td>${esc(fmtA(q,r.answers[q.id]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="muted">Todavía no hay respuestas.</p>'}</div>`;
  $('#ansBody').innerHTML=h;
  $('#ansBody').onclick=e=>{const tr=e.target.closest('tr[data-i]');if(tr)detail(ROWS[+tr.dataset.i]);};
}
function detail(r){
  const qs=allQ();const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><div class="mh"><h3>Respuesta del ${fmtD(r.at)}</h3><button class="btn sm danger" id="bDel">Borrar</button><button class="btn sm" id="bX">Cerrar</button></div>${qs.map(q=>{const v=r.answers[q.id];return `<div class="ans"><div class="k">${esc(q.texto)}</div><div class="a">${q.tipo==='firma'&&v?`<img src="${esc(v)}" alt="Firma">`:esc(fmtA(q,v))}</div></div>`;}).join('')}<div class="ans muted" style="font-size:12px">Enviado desde ${esc(r.device||'—')} · versión ${esc(r.version)} del formulario</div></div>`;
  document.body.appendChild(bg);const close=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)close();};bg.querySelector('#bX').onclick=close;
  const del=bg.querySelector('#bDel');del.onclick=async()=>{if(!del.dataset.armed){del.dataset.armed=1;del.textContent='¿Seguro? Pulsa otra vez';setTimeout(()=>{delete del.dataset.armed;del.textContent='Borrar';},3500);return;}
    del.disabled=true;try{await store.del(r._path,r._sha);close();toast('Respuesta borrada');viewAnswers(F);}catch(e){toast('No se pudo borrar');del.disabled=false;}};
}
function csv(){
  const qs=allQ();const head=['Fecha',...qs.map(q=>q.texto)];
  const rows=ROWS.map(r=>[fmtD(r.at),...qs.map(q=>fmtA(q,r.answers[q.id]))]);
  const s='﻿'+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=`${F.id}-respuestas.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* ---------------- Arranque ---------------- */
(async()=>{
  if(!CLOUD){document.body.innerHTML='<p style="padding:30px">Falta la configuración.</p>';return;}
  const raw=S.get('fm_sess',true)||S.get('fm_sess');
  if(raw)try{const s=JSON.parse(raw);if(s&&s.token)return startSession(s,false);}catch(e){}
  setTimeout(()=>$('#lockPw').focus(),50);
})();
</script>
